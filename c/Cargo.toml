# Test harness only. Builds ../src/lib.rs as a C shared library so main.c can
# link against the exported BrotliDecoder* symbols. It is never published: the
# package name is deliberately different from the real crate so that a
# `cargo publish` run from this directory cannot touch brotli-decompressor.
[package]
name = "brotli-decompressor-c-harness"
version = "0.0.0"
authors = ["Daniel Reiter Horn <danielrh@dropbox.com>", "The Brotli Authors"]
license = "BSD-3-Clause/MIT"
publish = false
autobins = false

[lib]
# Keep the library file name that the Makefile and main.c link against.
name = "brotli_decompressor"
path = "../src/lib.rs"
crate-type = ["cdylib"]

[profile.release]
incremental = false
lto = true

[dependencies]
# Keep identical to ../Cargo.toml so the harness exercises the same dependency
# generation as the crate it wraps.
"alloc-no-stdlib" = {version=">=3.0.0, <4.0.0"}
"alloc-stdlib" = {version=">=0.3.0, <0.4", optional=true}

[features]
# Same feature set as ../Cargo.toml, with the FFI on by default because
# exporting the C symbols is the whole point of this build.
default = ["std", "ffi-api"]
seccomp = ["alloc-no-stdlib/unsafe"]
std = ["alloc-stdlib"]
unsafe = ["alloc-no-stdlib/unsafe", "alloc-stdlib/unsafe"]
pass-through-ffi-panics = []
disable-timer = []
benchmark = []
ffi-api = []
no-stdlib-ffi-binding = ["ffi-api"]
